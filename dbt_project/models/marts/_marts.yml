version: 2

models:
  - name: dim_zones
    columns:
      - name: location_id
        data_tests: [unique, not_null]

  - name: dim_weather
    columns:
      - name: weather_hour
        data_tests: [unique, not_null]
      - name: temperature_c
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -40
              max_value: 50

  - name: fct_trips
    description: "One row per valid taxi trip."
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: pickup_zone_id
        data_tests:
          - relationships:
              to: ref('dim_zones')
              field: location_id
              config:
                severity: warn
      - name: pickup_hour
        data_tests:
          - relationships:
              to: ref('dim_weather')
              field: weather_hour
              config:
                severity: warn
      - name: tip_amount
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: mart_demand_by_weather
    description: "One row per hour: weather conditions alongside taxi demand and tipping."
    columns:
      - name: weather_hour
        data_tests: [unique, not_null]
      - name: trips
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0